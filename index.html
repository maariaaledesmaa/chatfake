const bkFmt=iso=>new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(', ',' ');
const bkGz=s=>new Response(new Blob([s]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
const bkUn=r=>new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
async function bkApi(action,extra={}){
 const hd={'content-type':'application/json'};if(BK_KEY.startsWith('eyJ'))hd.authorization='Bearer '+BK_KEY;
 let r;try{r=await fetch(BK_URL+'/functions/v1/chatfake-backup',{method:'POST',headers:hd,body:JSON.stringify({pin:bkPin,device:bkDev(),action,...extra})})}catch(e){throw{error:'net'}}
 const j=await r.json().catch(()=>({error:'bad'}));if(!r.ok)throw j;return j}
const bkMsg=e=>e.error=='pin'?`PIN incorrecto. Te quedan ${e.left} intento${e.left==1?'':'s'}.`:e.error=='locked'?'Demasiados intentos. Bloqueado hasta las '+new Date(e.until).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'.':e.error=='net'?'No se pudo conectar con Supabase (¿sin internet?).':e.error=='config'?'La función no tiene el PIN configurado.':'Error: '+(e.error||'desconocido')+(e.detail?' · '+e.detail:'');
function bkClose(){$('#md')?.remove();bkPin=''}
function bkOpen(){
 if(BK_URL.includes('TU-PROYECTO')){toast('Backup sin configurar: falta la URL de Supabase en el código');return}
 document.body.classList.remove('op');$('#md')?.remove();
 const d=document.createElement('div');d.id='md';d.innerHTML='<div class=mb><h3>☁ Backup privado</h3><div id=bkc></div></div>';
 d.addEventListener('mousedown',e=>{if(e.target===d)bkClose()});document.body.append(d);bkLogin()}
function bkLogin(msg){
 $('#bkc').innerHTML=`<small>Introduce el PIN de 4 dígitos.</small><input id=bkp type=password inputmode=numeric autocomplete=off maxlength=4 placeholder="••••" style="text-align:center;letter-spacing:.5em;font-size:22px"><div class=bke>${msg?h(msg):''}</div><div class=ac><button class=btn id=bkx>Cerrar</button></div>`;
 const i=$('#bkp');i.oninput=()=>{i.value=i.value.replace(/\D/g,'');if(i.value.length==4){bkPin=i.value;bkStatus()}};$('#bkx').onclick=bkClose;i.focus()}
async function bkStatus(){
 $('#bkc').innerHTML='<small>Comprobando…</small>';
 try{bkView(await bkApi('status'))}catch(e){if(e.error=='pin'||e.error=='locked'||e.error=='net'||e.error=='config')bkPin='';bkLogin(bkMsg(e))}}
function bkView(c){
 const L=bkL(),empty=!c.rev,same=!empty&&L.rev===c.rev,dirty=L.hash!==bkH();
 let st;
 if(empty)st='<div class="bks nu">Estado: Sin copia en la nube todavía</div>';
 else if(same)st='<div class="bks ok">Estado: Actualizado</div>'+(dirty?'<small class=bkw>⚠ Tienes cambios en este dispositivo que aún no has subido.</small>':'');
 else st=`<div class="bks no">Estado: No actualizado. Última actualización ${bkFmt(c.updated_at)} desde ${h(c.device||'?')}</div>`+(dirty&&L.rev?'<small class=bkw>⚠ Además, tienes cambios locales sin subir.</small>':'');
 $('#bkc').innerHTML=`${st}<label>Este dispositivo<input id=bkd maxlength=40 value="${h(bkDev())}"></label><div class=bkr><button class="btn pr" id=bku>⬆ Subir progreso</button><button class=btn id=bkdn ${empty?'disabled':''}>⬇ Descargar</button></div><div class=ac><button class=btn id=bkx>Cerrar</button></div>`;
 $('#bkd').oninput=e=>{try{localStorage.setItem('cf-bk-dev',e.target.value.trim())}catch(x){}};
 $('#bku').onclick=()=>bkUp(false);$('#bkdn').onclick=bkDown;$('#bkx').onclick=bkClose}
async function bkUp(force){
 $('#bkc').innerHTML='<small>Subiendo… no cierres la página.</small>';
 try{
  const L=bkL(),json=JSON.stringify(S),hash=bkH(json);let body=new Blob([json],{type:'application/json'}),enc='json';
  if(window.CompressionStream){try{body=await bkGz(json);enc='gz'}catch(e){}}
  let p;
  try{p=await bkApi('prepare',{baseRev:L.rev||0,enc,force:!!force})}
  catch(e){if(e.error=='conflict'){if(confirm(`Hay una versión más nueva en la nube (${bkFmt(e.updated_at)} desde ${e.device||'?'}).\n\nSi subes ahora, la SOBRESCRIBES y perderás esos cambios.\n\n¿Subir igualmente?`))return bkUp(true);return bkStatus()}throw e}
  const fd=new FormData();fd.append('cacheControl','3600');fd.append('',new Blob([body],{type:enc=='gz'?'application/gzip':'application/json'}));
  const r=await fetch(p.url,{method:'PUT',headers:{apikey:BK_KEY},body:fd}).catch(()=>{throw{error:'net'}});
  if(!r.ok)throw{error:'subida',detail:r.status+' '+(await r.text().catch(()=>'')).slice(0,120)};
  const c=await bkApi('commit',{path:p.path});
  bkSetL({rev:c.rev,hash});toast('Progreso subido ✔');bkView(c)
 }catch(e){toast(bkMsg(e));bkStatus()}}
async function bkDown(){
 if(!confirm('Esto REEMPLAZA todo lo que hay ahora en este dispositivo por la copia de la nube.\n\n¿Continuar?'))return;
 $('#bkc').innerHTML='<small>Descargando…</small>';
 try{
  const d=await bkApi('download'),r=await fetch(d.url).catch(()=>{throw{error:'net'}});
  if(!r.ok)throw{error:'descarga',detail:r.status};
  const o=JSON.parse(d.file.endsWith('.gz')?await bkUn(r):await r.text());
  if(!o||!Array.isArray(o.p)||!Array.isArray(o.c)||!Array.isArray(o.h))throw{error:'La copia no es válida'};
  o.n=o.n||[];S=o;ui.pid=null;commit();bkSetL({rev:d.rev,hash:bkH()});bkClose();toast('Copia descargada ✔')
 }catch(e){toast(e instanceof SyntaxError?'Error: copia ilegible':bkMsg(e));bkStatus()}}
/* Gesto secreto: móvil = mantener pulsado ☰ 1,5 s · ordenador = 5 clics rápidos en "Tema" */
(()=>{
 const mb=$('#mb');let tm,fired=0,clk=[];
 mb.addEventListener('pointerdown',()=>{fired=0;clearTimeout(tm);tm=setTimeout(()=>{fired=1;navigator.vibrate?.(30);bkOpen()},1500)});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>mb.addEventListener(n,()=>clearTimeout(tm)));
 mb.addEventListener('contextmenu',e=>e.preventDefault());
 document.addEventListener('click',e=>{
  if(fired&&e.target.closest('#mb')){fired=0;e.stopPropagation();e.preventDefault();return}
  if(e.target.closest('#tools [data-a=th]')){const n=Date.now();clk=clk.filter(x=>n-x<2500);clk.push(n);if(clk.length>=5){clk=[];e.stopPropagation();e.preventDefault();bkOpen()}}
 },true)})();
try{if(localStorage.getItem('cf-theme')=='dk')document.body.classList.add('dk')}catch(e){}
(async()=>{S=(await idb('get','s'))||{p:[],c:[],h:[],n:[]};dirH=await idb('get','d');ICONS=(await idb('get','icons'))||{};render();loadRepoIcons();if(!(S.p||[]).length)setTimeout(tourOffer,700)})();
</script></body></html>
