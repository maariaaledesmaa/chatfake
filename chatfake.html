function lock(p){const ns=S.n.filter(n=>n.pid==p.id).sort((a,b)=>b.t-a.t),bg=p.lw?`url('${p.lw}') center/cover`:`linear-gradient(160deg,hsl(${p.hu} 70% 50%),hsl(${p.hu+70} 60% 18%))`;
return `<div class=lock style="background:${bg}"><div class=ld id=ld></div><div class=lt id=lt></div>${wgt(p)}<div class=nl>${ns.map(n=>{const ex=ui.nx==n.id;return `<div class="nt${ex?' ex':''}" data-a=${n.cid?'oc':'nx'} data-c=${n.cid||0} data-n=${n.id}>${nic(n,p)}<div><b>${h(n.ti)}</b><span>${h(n.x)}</span>${ex?(n.cid?`<div class=qr><input id=qi placeholder="Responder…" autocomplete=off><button data-a=qs data-n=${n.id}>Enviar</button></div>`:`<div class=qr><button data-a=dn data-n=${n.id}>Eliminar</button></div>`):''}</div><small>${Date.now()-n.t<6e4?'ahora':hh(new Date(n.t))}</small><u data-a=nx data-n=${n.id}>⋯</u><u data-a=dn data-n=${n.id}>×</u></div>`}).join('')}${ns.length>1?'<button class=ca data-a=da>Borrar todo</button>':''}</div><div class=lb><i><svg viewBox="0 0 24 24"><path fill="#fff" d="M7.5 2.5h9v3.2L14.8 8H9.2L7.5 5.7z"/><rect x="9.2" y="9.3" width="5.6" height="12.2" rx="2" fill="#fff"/><rect x="11.2" y="12.2" width="1.6" height="3.4" rx=".8" fill="#4a4a4f"/></svg></i><i data-a=unlock><svg viewBox="0 0 24 24"><path fill="#fff" d="M8.4 6.6 9.5 4.6h5l1.1 2z"/><rect x="2.5" y="6.5" width="19" height="13.5" rx="3.2" fill="#fff"/><circle cx="12" cy="13.3" r="4.2" fill="#4a4a4f"/><circle cx="12" cy="13.3" r="2.6" fill="#2a2a2e"/><circle cx="18.6" cy="9.4" r=".9" fill="#4a4a4f"/></svg></i></div><div class=ul data-a=unlock>Toca para desbloquear</div><div class=hb data-a=unlock></div></div>`}

function render(){const p=P();$('#phone').style.display=p?'':'none';$('#picker').style.display=p?'none':'';tools();if(!p)return picker();
const sc=$('#screen');sc.className=`${p.v} ${p.dk?'dark':''} ${ui.scr=='lock'?'lk':''}`;sc.style.cssText=(p.bub?`--b:${p.bub};`:'')+`--bl:${(p.bat??100)/100}`;
sc.innerHTML=`<div id=sb><span id=clk></span><span><svg width=18 height=12 viewBox="0 0 18 12"><path d="M1 8h3v3H1zM6 6h3v5H6zM11 3.5h3V11h-3zM16 1h2v10h-2z" fill=currentColor /></svg><i class=bt></i></span></div>`+(ui.scr=='lock'?lock(p):`<div id=app>${ui.scr=='chat'?chat(p):list(p)}</div>`);
tick();const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}

function openChat(c){ui.cid=c;ui.scr='chat';const m=me(ui.pid);ui.snd=m.id;ui.reply=null;S.n=S.n.filter(n=>!(n.pid==ui.pid&&n.cid==c));S.h.find(z=>z.id==c).s.forEach(g=>{if(g.f!=m.id&&!(g.rb??=[]).includes(ui.pid))g.rb.push(ui.pid)});save()}
function send(x,i){const c=cur(),s={id:id(),f:ui.snd,x,t:Date.now()};if(i)s.i=i;if(ui.reply)s.q=ui.reply;s.rb=ui.scr=='chat'&&me(ui.pid)&&me(ui.pid).id!=s.f?[ui.pid]:[];c.s.push(s);ui.reply=null;
c.m.forEach(k=>{const q=ch(k);if(k!=s.f&&q.pid&&!(q.pid==ui.pid&&ui.scr=='chat'))S.n.push({id:id(),pid:q.pid,cid:c.id,ti:c.g?c.n:cn(ch(s.f),q.pid).n,x:(c.g?cn(ch(s.f),q.pid).n+': ':'')+(x||'📷 Foto'),t:s.t})});commit()}
function doSend(){const i=$('#inp'),v=i.value.trim();if(!v)return;send(v);$('#inp')?.focus()}

function newP(){modal('Nuevo perfil',`<label>Nombre del personaje<input id=c1></label><label>Vista<select id=c2><option value=ios>iMessage</option><option value=wa>WhatsApp</option></select></label>`,()=>{const n=$('#c1').value.trim();if(!n)return;const p={id:id(),n,v:$('#c2').value,hu:Math.random()*360|0};S.p.push(p);newChar(n).pid=p.id;commit()})}
function newDM(){const p=P(),m=me(p.id);modal('Nuevo chat individual',`<label>Personaje existente<select id=b1><option value="">— crear nuevo —</option>${S.c.filter(c=>c.id!=m.id).map(c=>`<option value=${c.id}>${h(c.n)}${c.pid?' 📱':''}</option>`).join('')}</select></label><label>Nombre (si es nuevo)<input id=b2></label><label>Vincular con un perfil (móvil)<select id=b3><option value="">Sin vincular</option>${S.p.filter(q=>q.id!=p.id).map(q=>`<option value=${q.id}>${h(q.n)}</option>`).join('')}</select></label><label>Foto (opcional)<input type=file id=b4 accept=image/*></label>`,async()=>{const v=k=>$('#'+k).value,nw=!v('b3')&&!v('b1'),c=v('b3')?me(v('b3')):v('b1')?ch(v('b1')):v('b2').trim()?newChar(v('b2').trim()):null;if(!c||c.id==m.id)return;const ff=$('#b4').files[0];if(ff){const im=await crop(ff,SQ);if(im){if(nw)c.img=im;else((p.o??={})[c.id]??={}).img=im}}ui.cid=dm(m,c).id;ui.snd=m.id;ui.scr='chat';commit()})}
function newGroup(){const p=P(),m=me(p.id);modal('Nuevo grupo',`<label>Nombre del grupo<input id=g1></label><label>Foto del grupo<input type=file id=g5 accept=image/*></label><label>Personajes existentes (📱 = con móvil)</label>${S.c.filter(c=>c.id!=m.id).map(c=>`<label class=ck><input type=checkbox class=gc value=${c.id}> ${h(c.n)}${c.pid?' 📱':''}</label>`).join('')||'<small>Aún no hay personajes</small>'}<label>Personajes nuevos (separados por comas)<input id=g2></label>`,async()=>{const ids=[...document.querySelectorAll('.gc:checked')].map(e=>e.value),nw=$('#g2').value.split(',').map(s=>s.trim()).filter(Boolean);if(!ids.length&&!nw.length)return;nw.forEach(n=>{const c=newChar(n);ids.push(c.id);dm(m,c)});const x={id:id(),g:1,img:$('#g5').files[0]?await crop($('#g5').files[0],SQ):null,n:$('#g1').value.trim()||'Grupo',m:[m.id,...ids],s:[],t:Date.now()};S.h.push(x);ui.cid=x.id;ui.snd=m.id;ui.scr='chat';ui.tab='g';commit()})}
function settings(){const p=P();modal('Ajustes de '+h(p.n),`<label>Nombre<input id=a1 value="${h(p.n)}"></label><label>Vista de mensajería<select id=a2><option value=ios ${p.v=='ios'?'selected':''}>iMessage</option><option value=wa ${p.v=='wa'?'selected':''}>WhatsApp</option></select></label><label class=ck><input type=checkbox id=a3 ${p.dk?'checked':''}> Modo oscuro</label><label>Color de burbujas enviadas<input type=color id=a4 value="${p.bub||'#0a84ff'}"></label><label class=ck><input type=checkbox id=a5 ${p.bub?'':'checked'}> Color por defecto</label><label>Fondo del chat (imagen, WhatsApp)<input type=file id=a6 accept=image/*></label><label>Fondo de pantalla de bloqueo<input type=file id=a7 accept=image/*></label><label>Tu foto de perfil<input type=file id=a9 accept=image/*></label><label class=ck><input type=checkbox id=a8> Quitar fondos personalizados</label><button class=btn data-a=dp>🗑 Eliminar este perfil</button>`,async()=>{p.n=$('#a1').value.trim()||p.n;me(p.id).n=p.n;p.v=$('#a2').value;p.dk=$('#a3').checked;p.bub=$('#a5').checked?null:$('#a4').value;if($('#a8').checked){p.wi=p.lw=null}if($('#a9').files[0]){const im=await crop($('#a9').files[0],SQ);if(im)me(p.id).img=im}if($('#a6').files[0])p.wi=await rd($('#a6').files[0],900);if($('#a7').files[0])p.lw=await rd($('#a7').files[0],1000);commit()})}

async function snap(){document.body.classList.remove('op');if(innerWidth<=760)await new Promise(r=>setTimeout(r,350));const lk=ui.scr=='lock',el=lk?$('#screen'):($('#cap')||$('#app')),msg=[];
try{const cv=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:null}),b=await new Promise(r=>cv.toBlob(r));
try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);msg.push('copiada al portapapeles')}catch(e){msg.push('no se pudo copiar (usa Chrome/Edge/Opera)')}
if(dirH){try{if(await dirH.queryPermission({mode:'readwrite'})!='granted')await dirH.requestPermission({mode:'readwrite'});const w=await(await dirH.getFileHandle('captura-'+Date.now()+'.png',{create:true})).createWritable();await w.write(b);await w.close();msg.push('guardada en '+dirH.name)}catch(e){msg.push('error al guardar en la carpeta')}}}
catch(e){msg.push('error al capturar (¿hay internet para cargar html2canvas?)')}toast('Captura: '+msg.join(' · '))}
async function pickDir(){try{dirH=await showDirectoryPicker({mode:'readwrite'});await idb('put','d',dirH);toast('Capturas se guardarán en: '+dirH.name)}catch(e){toast('No se eligió carpeta (¿navegador compatible?)')}tools()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='chatfake-backup.json';a.click()}

const A={wd:()=>widgets(),nx:d=>{ui.nx=ui.nx==d.n?null:d.n},da:()=>{S.n=S.n.filter(n=>n.pid!=ui.pid);save()},qs:d=>{const v=$('#qi')?.value.trim(),nn=S.n.find(x=>x.id==d.n);if(!v||!nn)return;ui.cid=nn.cid;ui.snd=me(ui.pid).id;ui.reply=null;send(v);S.n=S.n.filter(x=>x.id!=d.n);ui.nx=null;commit();toast('Respuesta enviada')},nn:()=>newNotif(),th:()=>{const b=document.body.classList;b.toggle('dk');try{localStorage.setItem('cf-theme',b.contains('dk')?'dk':'')}catch(e){}tools()},mb:()=>document.body.classList.toggle('op'),ep:()=>editChat(cur()),view:()=>{const p=P();p.v=p.v=='ios'?'wa':'ios';save()},ec:()=>editChat(cur()),go:d=>{const c=ch(d.c);if(!c.pid)return toast('Este personaje no tiene móvil vinculado');const x=cur();ui.pid=c.pid;openChat(x.id)},sel:d=>{ui.pid=d.p;ui.scr='lock'},np:newP,swp:()=>{ui.pid=null},lk:()=>{ui.scr='lock'},unlock:()=>{ui.scr='list'},bk:()=>{ui.scr='list'},tab:d=>{ui.tab=d.t},set:settings,nw:(d,e)=>menu(e,[['👤 Nuevo chat',newDM],['👥 Nuevo grupo',newGroup]]),oc:d=>openChat(d.c),dn:d=>{S.n=S.n.filter(n=>n.id!=d.n);save()},snd:doSend,img:()=>$('#fi').click(),rx:()=>{ui.reply=null},cam:snap,dir:pickDir,exp,imp:()=>$('#fj').click(),x:()=>$('#md')?.remove(),
ok:async()=>{const f=cb;await f();$('#md')?.remove()},
dp:()=>{if(!confirm('¿Eliminar el perfil? Sus chats dejarán de verse en su móvil.'))return;S.n=S.n.filter(n=>n.pid!=ui.pid);me(ui.pid).pid=null;S.p=S.p.filter(p=>p.id!=ui.pid);ui.pid=null;$('#md')?.remove();commit()}};
const NR='wd nn th mb ep ec img cam dir exp imp x ok dp set nw np snd';
document.addEventListener('click',async e=>{if(lpT)return;if(!e.target.closest('#cm'))$('#cm')?.remove();if(!e.target.closest('#tools,#mb'))document.body.classList.remove('op');if(e.target.closest('.qr input'))return;const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(!A[a])return;if(a!='mb'&&t.closest('#tools'))document.body.classList.remove('op');await A[a](t.dataset,e);if(!NR.split(' ').includes(a))render()});
document.addEventListener('keydown',e=>{if(e.target.id=='inp'&&e.key=='Enter')doSend();if(e.target.id=='qi'&&e.key=='Enter')document.querySelector('[data-a=qs]')?.click()});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='snd')ui.snd=t.value;
if(t.id=='fi'&&t.files[0]){const fl=t.files[0];t.value='';const im=await crop(fl,{free:1,max:900});if(im)send('',im)}
if(t.id=='fj'&&t.files[0]){try{S=JSON.parse(await t.files[0].text());ui.pid=null;commit();toast('Importado')}catch(x){toast('Archivo no válido')}t.value=''}});
document.addEventListener('contextmenu',e=>{const m=e.target.closest('.m'),r=e.target.closest('.row');
if(m){e.preventDefault();const c=cur(),g=c.s.find(z=>z.id==m.dataset.i);menu(e,[['🕒 Hora y estado',()=>msgOpts(c,g)],['↩ Responder',()=>{ui.reply=g.id;render();$('#inp').focus()}],['✏ Editar',()=>{const v=prompt('Editar mensaje',g.x||'');if(v!=null){g.x=v;commit()}}],['🗑 Eliminar',()=>{c.s=c.s.filter(z=>z!=g);commit()}]],q=>{g.e=g.e==q?null:q;commit()})}
else if(r){e.preventDefault();const c=S.h.find(z=>z.id==r.dataset.c);menu(e,[['🎨 Personalizar',()=>editChat(c)],['⧉ Duplicar chat',()=>{S.h.push({...JSON.parse(JSON.stringify(c)),id:id()});commit()}],['🗑 Eliminar chat',()=>{if(confirm('¿Eliminar este chat?')){S.h=S.h.filter(z=>z!=c);commit()}}]])}});
let mp,lpT=0;document.addEventListener('mousedown',e=>{const el=e.target.closest('.m');if(e.button||!el)return;mp=setTimeout(()=>{lpT=1;el.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:e.clientX,clientY:e.clientY}))},600)});document.addEventListener('mouseup',()=>{clearTimeout(mp);setTimeout(()=>lpT=0,120)});
let lp;document.addEventListener('touchstart',e=>{const t=e.touches[0],el=e.target;lp=setTimeout(()=>el.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:t.clientX,clientY:t.clientY})),550)},{passive:true});['touchend','touchmove','touchcancel'].forEach(n=>document.addEventListener(n,()=>clearTimeout(lp),{passive:true}));
try{if(localStorage.getItem('cf-theme')=='dk')document.body.classList.add('dk')}catch(e){}
(async()=>{S=(await idb('get','s'))||{p:[],c:[],h:[],n:[]};dirH=await idb('get','d');render()})();
</script></body></html>
